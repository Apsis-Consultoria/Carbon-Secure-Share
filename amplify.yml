version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # NENHUMA variavel de ambiente e exportada aqui, de proposito.
        #
        # O frontend nao conhece URL de Supabase nem chave nenhuma: ele chama o
        # caminho relativo /api/<funcao>, e quem traduz isso para as Edge
        # Functions e a regra de rewrite da hospedagem (ver a secao Deploy do
        # README). Nada que identifique o projeto entra no bundle.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# =============================================================================
# ESTE ARQUIVO NAO CONFIGURA REWRITE NEM CABECALHO. Ele so descreve o build.
#
# Ate 02/09/2026 havia aqui um `customRules` e um `customHeaders`, e o Amplify
# IGNORAVA os dois em silencio. O custo apareceu no primeiro dia de producao:
# /api/carbon-ss-codigo devolvia 404 e todo link direto da SPA devolvia 404
# tambem, porque nem o proxy de /api nem o catch-all existiam de fato.
#
# ONDE CADA COISA MORA:
#   CABECALHOS -> customHttp.yml, na raiz deste repositorio
#                 https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
#   REWRITE    -> SOMENTE no console. Nao existe arquivo para isso
#                 https://docs.aws.amazon.com/amplify/latest/userguide/redirects.html
#
# -----------------------------------------------------------------------------
# AS DUAS REGRAS NO CONSOLE, App settings > Rewrites and redirects, NESTA ORDEM
# -----------------------------------------------------------------------------
#   1)  source  /api/<*>
#       target  https://<REF>.supabase.co/functions/v1/<*>
#       type    200 (Rewrite)
#
#   2)  source  /<*>
#       target  /index.html
#       type    200 (Rewrite)
#
# A ORDEM IMPORTA: o Amplify para na primeira regra que casa. Com o catch-all em
# cima, ele engole /api/* e devolve index.html no lugar da resposta da funcao -
# e src/lib/api.js detecta isso pelo content-type e avisa que falta o rewrite,
# em vez de estourar um erro de JSON invalido.
#
# A SINTAXE DO CURINGA E <*>. Escrever /api/* nao casa com nada: 404.
#
# O DESTINO DA REGRA 1 NAO ESTA AQUI de proposito: contem o ref do projeto
# Supabase, e versionar isso gravaria no repositorio qual projeto e o de
# producao - o que a arquitetura /api existe para evitar (ver src/lib/endpoint.js).
#
# COM CLOUDFLARE NA FRENTE: a regra continua sendo do Amplify. A Cloudflare
# precisa NAO atrapalhar - /api/* fora do cache (as respostas sao por sessao),
# Authorization intacto, e SSL/TLS em Full (strict).
# =============================================================================
