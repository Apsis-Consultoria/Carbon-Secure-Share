version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # NENHUMA variavel de ambiente e exportada aqui, de proposito.
        #
        # O frontend nao conhece URL de Supabase nem chave nenhuma: ele chama o
        # caminho relativo /api/<funcao>, e quem traduz isso para as Edge
        # Functions e a regra de rewrite da hospedagem (ver a secao Deploy do
        # README). Nada que identifique o projeto entra no bundle.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# A ORDEM IMPORTA. O Amplify avalia as regras de cima para baixo e para na
# primeira que casar. Se o catch-all da SPA viesse antes, ele engoliria /api/*
# e devolveria o index.html no lugar da resposta da funcao.
#
# A regra de /api NAO esta aqui: o destino contem o ref do projeto Supabase, e
# deixa-lo no repositorio significaria versionar qual projeto e o de producao.
# Ela e configurada no console do Amplify (App settings > Rewrites and
# redirects), que e onde mora o resto da configuracao de ambiente:
#
#   source  /api/<*>
#   target  https://<ref>.supabase.co/functions/v1/<*>
#   type    200 (Rewrite)
#
# Sem essa regra, /api/* cai no catch-all abaixo e devolve HTML. A camada de API
# do frontend detecta isso pelo content-type e mostra mensagem propria em vez de
# um erro de JSON invalido (ver src/lib/api.js).
customRules:
  - source: /<*>
    target: /index.html
    status: '200'

# TENTATIVA de esconder de qual projeto Supabase as respostas vem.
#
# O QUE VAZA HOJE: o gateway do Supabase carimba `sb-project-ref` em TODA
# resposta, e o rewrite repassa. O ref nao esta no bundle nem na barra de
# endereco, mas aparece na aba Network do DevTools em qualquer requisicao -
# medido em 25/08/2026.
#
# ISTO PODE NAO FUNCIONAR. `customHeaders` e documentado para o conteudo que o
# proprio Amplify serve; se ele sobrescreve cabecalho vindo de um rewrite de
# proxy, a documentacao nao diz. Conferir DEPOIS do deploy, com:
#
#   curl.exe -s -D - -o NUL https://<dominio>/api/app-config | Select-String "sb-"
#
# Sem saida: funcionou. Ainda mostrando sb-project-ref: nao funcionou, e o
# lugar certo passa a ser uma Transform Rule de resposta na Cloudflare.
#
# NAO REMOVER sb-request-id NEM x-deno-execution-id SEM PENSAR: sao eles que
# ligam um erro relatado pelo cliente ao log da funcao no painel do Supabase.
# Escondendo os dois, "me manda o id do erro" deixa de existir como caminho de
# suporte. Estao aqui porque tambem identificam o Supabase, mas a troca e real.
#
# E VALE LEMBRAR O QUE ISTO NAO E: esconder a URL nao e o que protege o sistema.
# Quem defende as funcoes e a autenticacao dentro delas - ID token do Azure
# validado contra o JWKS da Microsoft no carbon-api, token de sessao HMAC no
# Secure Share. Isto aqui e defesa em profundidade: obriga o trafego a passar
# pelo nosso dominio, onde ha log e limite de taxa.
customHeaders:
  - pattern: '/api/<*>'
    headers:
      - key: 'sb-project-ref'
        value: ''
      - key: 'sb-request-id'
        value: ''
      - key: 'sb-gateway-version'
        value: ''
      - key: 'x-served-by'
        value: ''
      - key: 'x-sb-edge-region'
        value: ''
      - key: 'x-deno-execution-id'
        value: ''
